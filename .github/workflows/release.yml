name: Release

# Su push di un tag vX.Y.Z: compila, firma, carica su Maven Central (Sonatype
# Central Portal) e crea la GitHub Release con i jar.
#
# Lanciato a mano (workflow_dispatch) fa una PROVA A SECCO: compila e firma
# ma non carica nulla su Central e non crea la Release. Serve a verificare
# secret e firma senza consumare release del limite mensile.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # serve solo a `gh release create`
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Niente `cache: maven`: in un job che maneggia chiavi di firma e token
      # preferisco non ripristinare cache prodotte da altri run.
      - name: Set up JDK 8 and Maven settings
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '8'
          distribution: 'temurin'
          server-id: central # deve coincidere con publishingServerId nel pom.xml
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD

      - name: Check that the tag matches a release version in pom.xml
        if: github.ref_type == 'tag'
        run: |
          version=$(mvn --batch-mode --quiet -DforceStdout \
            org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
            -Dexpression=project.version)
          echo "pom.xml version: $version - tag: $GITHUB_REF_NAME"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match a release version in pom.xml ($version)"
            exit 1
          fi

      # La firma avviene in fase `verify`, prima dell'upload: se chiave o
      # passphrase sono sbagliate il job fallisce senza toccare Central.
      - name: Build, sign and (on tags) deploy to Maven Central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then goal=deploy; else goal=verify; fi
          mvn --batch-mode -Dgpg.signer=bc clean "$goal"

      - name: List signed artifacts (dry run)
        if: github.ref_type != 'tag'
        run: ls -l target/*.jar target/*.asc target/*.zip target/*.tar.gz

      # Gli archivi ZIP/TAR.GZ sono prodotti da maven-assembly-plugin (fase
      # `package`, attach=false): finiscono in target/ ma non su Central.
      - name: Create GitHub Release with jars and distribution archives
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/*.jar target/*.zip target/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
